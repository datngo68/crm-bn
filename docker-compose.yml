services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: crm-bn-web
    ports:
      - "127.0.0.1:3010:3000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - docker_default
      - supabase_default

networks:
  docker_default:
    external: true
  supabase_default:
    external: true
